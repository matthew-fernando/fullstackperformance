<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 70" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
      .text-bold {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 64px;
        fill: #ffffff;
        letter-spacing: -1.5px;
      }
      .text-regular {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        font-size: 64px;
        fill: #f8fafc;
        letter-spacing: -1px;
      }
    </style>
  </defs>

  <g transform="translate(305, 52)">
    <text text-anchor="end" class="text-bold">fullstack</text>
    <text text-anchor="start" class="text-regular">performance</text>
  </g>
